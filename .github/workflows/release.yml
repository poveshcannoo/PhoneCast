name: Release APK

# Runs when you publish a release on GitHub (Releases -> Draft a new release -> Publish).
# Builds a signed APK and attaches it to that release as PhoneCast-<version>.apk.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Work out version from the tag (v1.2.3 -> 1.2.3 / 10203)
        run: |
          TAG="${{ github.event.release.tag_name }}"
          NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${NAME%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Building $NAME (versionCode $CODE)"

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 secret (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PhoneCast-$VERSION_NAME.apk"
          gh release upload "${{ github.event.release.tag_name }}" "PhoneCast-$VERSION_NAME.apk" --clobber
